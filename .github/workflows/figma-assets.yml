name: Export design assets
on:
  push:
    branches: [design/focusiq-assets]
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Download original transparent Figma vectors
        run: |
          set -euo pipefail
          mkdir -p design-assets/originals design-assets/drawable
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          curl --fail -L --max-time 30 'https://www.figma.com/api/mcp/asset/3edf9574-596f-4e22-9917-e604a5fd07d1/5d6ec.svg' -o design-assets/originals/figma_timer_ring.svg
          rsvg-convert design-assets/originals/figma_timer_ring.svg -o design-assets/drawable/figma_timer_ring.png
          curl --fail -L --max-time 30 'https://www.figma.com/api/mcp/asset/3edf9574-596f-4e22-9917-e604a5fd07d1/9c9b9.svg' -o design-assets/originals/figma_notification.svg
          rsvg-convert design-assets/originals/figma_notification.svg -o design-assets/drawable/figma_notification.png
          curl --fail -L --max-time 30 'https://www.figma.com/api/mcp/asset/3edf9574-596f-4e22-9917-e604a5fd07d1/1b55a.svg' -o design-assets/originals/figma_notification_badge.svg
          rsvg-convert design-assets/originals/figma_notification_badge.svg -o design-assets/drawable/figma_notification_badge.png
          curl --fail -L --max-time 30 'https://www.figma.com/api/mcp/asset/efc5ea17-b757-446e-84d9-7e8a7fe1d6a8/b2b95.svg' -o design-assets/originals/figma_task_glow_wide.svg
          rsvg-convert design-assets/originals/figma_task_glow_wide.svg -o design-assets/drawable/figma_task_glow_wide.png
          curl --fail -L --max-time 30 'https://www.figma.com/api/mcp/asset/efc5ea17-b757-446e-84d9-7e8a7fe1d6a8/3fde2.svg' -o design-assets/originals/figma_task_glow_soft.svg
          rsvg-convert design-assets/originals/figma_task_glow_soft.svg -o design-assets/drawable/figma_task_glow_soft.png
          curl --fail -L --max-time 30 'https://www.figma.com/api/mcp/asset/efc5ea17-b757-446e-84d9-7e8a7fe1d6a8/0a6dd.svg' -o design-assets/originals/figma_task_glow_near.svg
          rsvg-convert design-assets/originals/figma_task_glow_near.svg -o design-assets/drawable/figma_task_glow_near.png
          curl --fail -L --max-time 30 'https://www.figma.com/api/mcp/asset/3edf9574-596f-4e22-9917-e604a5fd07d1/ba358.svg' -o design-assets/originals/figma_play.svg
          rsvg-convert design-assets/originals/figma_play.svg -o design-assets/drawable/figma_play.png
          curl --fail -L --max-time 30 'https://www.figma.com/api/mcp/asset/efc5ea17-b757-446e-84d9-7e8a7fe1d6a8/ad01e.svg' -o design-assets/originals/figma_suggestion.svg
          rsvg-convert design-assets/originals/figma_suggestion.svg -o design-assets/drawable/figma_suggestion.png
          curl --fail -L --max-time 30 'https://www.figma.com/api/mcp/asset/efc5ea17-b757-446e-84d9-7e8a7fe1d6a8/b19f9.svg' -o design-assets/originals/figma_task_play.svg
          rsvg-convert design-assets/originals/figma_task_play.svg -o design-assets/drawable/figma_task_play.png
          curl --fail -L --max-time 30 'https://www.figma.com/api/mcp/asset/b53e1dac-ee10-419a-a376-3ccc9d14ce4f/60cb7.svg' -o design-assets/originals/figma_chevron.svg
          rsvg-convert design-assets/originals/figma_chevron.svg -o design-assets/drawable/figma_chevron.png
          curl --fail -L --max-time 30 'https://www.figma.com/api/mcp/asset/b53e1dac-ee10-419a-a376-3ccc9d14ce4f/698b9.svg' -o design-assets/originals/figma_dark_mode.svg
          rsvg-convert design-assets/originals/figma_dark_mode.svg -o design-assets/drawable/figma_dark_mode.png
          curl --fail -L --max-time 30 'https://www.figma.com/api/mcp/asset/b53e1dac-ee10-419a-a376-3ccc9d14ce4f/e664f.svg' -o design-assets/originals/figma_sound.svg
          rsvg-convert design-assets/originals/figma_sound.svg -o design-assets/drawable/figma_sound.png
          curl --fail -L --max-time 30 'https://www.figma.com/api/mcp/asset/b53e1dac-ee10-419a-a376-3ccc9d14ce4f/5412c.svg' -o design-assets/originals/figma_logout.svg
          rsvg-convert design-assets/originals/figma_logout.svg -o design-assets/drawable/figma_logout.png
      - uses: actions/upload-artifact@v4
        with:
          name: focusiq-design-assets
          path: design-assets/
          if-no-files-found: error
