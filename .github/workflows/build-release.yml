name: Build signed APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the verified signed APK as the latest GitHub release (main only)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'app/**'
      - 'firebase/**'
      - 'functions/**'
      - 'render.yaml'
      - '.github/workflows/build-release.yml'
  push:
    branches: [main, feat/live-leaderboards]
    paths:
      - 'app/**'
      - 'firebase/**'
      - 'functions/**'
      - 'render.yaml'
      - 'firebase.json'
      - '.github/workflows/build-release.yml'

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
        run: |
          for secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD GOOGLE_SERVICES_BASE64; do
            if [ -z "${!secret}" ]; then echo "Missing secret: $secret"; exit 1; fi
          done
      - name: Restore private build files
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/study-sprint-release.jks"
          printf '%s' "$GOOGLE_SERVICES_BASE64" | base64 --decode > app/google-services.json
      - name: Build release
        env:
          STUDY_CHAT_URL: ${{ vars.STUDY_CHAT_URL }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/study-sprint-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-Sprint-signed-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    needs: [build, leaderboard-rules, navigation-ui, chat-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Study-Sprint-signed-release
          path: release-apk
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${{ vars.STUDY_CHAT_URL }}" ] || { echo "Configure STUDY_CHAT_URL before publishing shared chat"; exit 1; }
          version=$(awk -F '"' '/versionName =/ {print $2}' app/build.gradle.kts)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          existing_tag=$(git ls-remote --tags origin "refs/tags/$tag")
          [ -z "$existing_tag" ] || { echo "Refusing to reuse existing tag $tag"; exit 1; }
          asset="Study-Sprint-$tag.apk"
          mapfile -t apks < <(find release-apk -name '*.apk' ! -name '*unsigned*')
          [ "${#apks[@]}" -eq 1 ]
          cp "${apks[0]}" "$asset"
          sha256sum "$asset" > "$asset.sha256"
          gh release create "$tag" "$asset" "$asset.sha256" \
            --target "$GITHUB_SHA" --title "Study Sprint $tag" \
            --notes-file "RELEASE_NOTES_$tag.md" --latest

  leaderboard-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install rules test dependencies
        working-directory: firebase
        run: npm ci --no-audit --no-fund
      - name: Test Firestore security rules
        working-directory: firebase
        run: npx firebase emulators:exec --project demo-study-sprint --only firestore 'npm test' --config ../firebase.json

  navigation-ui:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Firebase build configuration
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
        run: printf '%s' "$GOOGLE_SERVICES_BASE64" | base64 --decode > app/google-services.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test real Compose tab navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            bash ./gradlew --no-daemon connectedDebugAndroidTest
            mkdir -p ui-proof
            adb pull /sdcard/Pictures/StudySprintUi/. ui-proof/
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-ui-results
          path: |
            app/build/reports/androidTests/connected/**
            ui-proof/**

  chat-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix functions
