name: Build signed APK

on:
  workflow_dispatch:
  push:
    branches: [main, feat/live-leaderboards]
    paths:
      - 'app/**'
      - 'firebase/**'
      - 'firebase.json'
      - '.github/workflows/build-release.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
        run: |
          for secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD GOOGLE_SERVICES_BASE64; do
            if [ -z "${!secret}" ]; then echo "Missing secret: $secret"; exit 1; fi
          done
      - name: Restore private build files
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/study-sprint-release.jks"
          printf '%s' "$GOOGLE_SERVICES_BASE64" | base64 --decode > app/google-services.json
      - name: Build release
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/study-sprint-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-Sprint-signed-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  leaderboard-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install rules test dependencies
        working-directory: firebase
        run: npm ci --no-audit --no-fund
      - name: Test Firestore security rules
        working-directory: firebase
        run: npx firebase emulators:exec --project demo-study-sprint --only firestore 'npm test' --config ../firebase.json
